# @package _global_
train_dataset:
  task: null
  demo: null
  path: null
  _target_: rtpolicy.datasets.builder.build_dataset
  backend: lerobot
  root: ${train_dataset.path}/${train_dataset.task}
  repo_id: D-robotics/${train_dataset.task}
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  obs_image_frame_indices: ${obs_image_frame_indices}
  pad_before: ${n_obs_steps}
  rgb_key: ${oc.select:model.obs_encoder.rgb_key,head_cam}
  pad_after: 3
  seed: 42
  val_ratio: 0.02
  max_train_episodes: ${train_dataset.demo}
  # Auto-mask state dimensions below a >=100x adjacent range gap.
  # Set null or <=0 to preserve the legacy all-dim behavior explicitly.
  static_joint_ratio_threshold: 100.0
  # [Temporary - added for cache speed testing, remove afterwards] episode cache keys
  cache_to_ram: false
  cache_mode: lazy
  cache_backend: local
  cache_socket: null
  npy_feature_keys: null
  dataset_metadata:
    _target_: lerobot.datasets.lerobot_dataset.LeRobotDatasetMetadata
    root: ${train_dataset.root}
    repo_id: ${train_dataset.repo_id}
