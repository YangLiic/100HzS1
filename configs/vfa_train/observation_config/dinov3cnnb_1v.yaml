# @package _global_
model:
  obs_encoder:
    state_key: null
    # rgb_key: ["head_cam", "front_cam"]
    emvis_config:
      processor_config:
        load_pretrain: true
      dim_2d: 1024
      load_backbone_pretrain: true
      only_2d: true
      backbone_target: 'dinov3cnn'
      backbone_path: pretrained/dinov3-cnn-base
      backbone_config: {}
      # interpolate: 'bilinear'
      mlp_ratio: 1.0
      drop_p: 0.0
      ft_layer_idx: []
      # intermediate_layer_idx: [23]
      only_first_view: True
      model_adapter_config:
        target: ResNetAdapter
        shape_out: [2, 2]
        dim_out: 1024
        conv_num: 2
      mv_fuser_config: {}