# Same dataset/backbone/batch/epochs as the EfficientViT-B2 native FM baseline.
# Pure conditional MeanFlow: guidance disabled, no Dispersive Loss.
defaults:
  - 100hzs1_beat_block_hammer_efficientvit_b2_native_3v_8gpu_L4
  - _self_

model:
  flow_type: meanflow
  meanflow:
    equal_time_ratio: 0.5
    guidance_scale: 1.0

inference:
  num_inference_timesteps: 1

resume_from_checkpoint: null
output_dir: ${checkpoint_root}/beat_block_hammer/efficientvit_b2_native_meanflow_3v_obs1_h24_8gpu_L4_20261029_v1
base_dir: ${output_dir}
hydra:
  run:
    dir: ${output_dir}/hydra
