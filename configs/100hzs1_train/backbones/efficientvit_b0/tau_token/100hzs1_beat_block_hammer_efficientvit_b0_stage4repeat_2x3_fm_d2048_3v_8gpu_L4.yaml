# @package _global_
# Fresh standard FM experiment; 4-step inference. No policy checkpoint resume.
defaults:
  - /backbones/efficientvit_b2/tau_token/100hzs1_beat_block_hammer_efficientvit_b2_native_3v_8gpu_L4
  - /observation_config/efficientvit_b0_native_3v
  - _self_

norm: minmax
seed: 42
num_train_epochs: 200
checkpointing_period: 2000
inference:
  num_inference_timesteps: 4
  backend: eager
  precision: bf16
  use_kv_cache: true
  use_cuda_graph: false

model:
  flow_type: fm
  time_injection: tau_token
  hidden_size: 2048
  num_heads: 32
  scene_adaptor: mlp2x_gelu
  state_adaptor: mlp3x_gelu
  noise_scheduler:
    num_train_timesteps: 1000
    num_inference_timesteps: 4
  obs_encoder:
    emvis_config:
      backbone_config:
        stage4_repeats: 2
        mbconv_downsample_blocks: 0
      compress_before_fusion: false
      output_projection_type: linear
      model_adapter_config:
        target: TokenProjection
        dim_out: 1024
        shape_out: [2, 3]
        conv_num: null

resume_from_checkpoint: null
output_dir: ${checkpoint_root}/beat_block_hammer/beat_b0_fm4_ablation_20261101_v1/stage4_d2048
base_dir: ${output_dir}
hydra:
  run:
    dir: ${output_dir}/hydra
