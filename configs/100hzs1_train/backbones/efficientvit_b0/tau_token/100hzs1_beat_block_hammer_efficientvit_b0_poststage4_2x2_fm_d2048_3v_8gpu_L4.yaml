resume_from_checkpoint: null
output_dir: ${checkpoint_root}/beat_block_hammer/beat_b0_fm4_postfusion_stage4_2x2_20261101_v1
base_dir: ${output_dir}
hydra:
  run:
    dir: ${output_dir}/hydra
