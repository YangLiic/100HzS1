model:
  obs_encoder:
    emvis_config:
      backbone_config:
        stage4_repeats: 2
        stage4_repeat_position: post_fusion
        mbconv_downsample_blocks: 0
      model_adapter_config:
        target: ResNetAdapter
        conv_num: null
        stage_blocks: []
        dim_ratio: []
