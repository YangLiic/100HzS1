# @package _global_
# DiT FFNs are fixed in code to the 1024 token width; visual residual MLP remains 2048 inside.
defaults:
  - /backbones/efficientvit_b0/tau_token/100hzs1_beat_block_hammer_efficientvit_b0_postfusion_2x2_fm_d1024_3v_8gpu_L4
  - _self_

model:
  hidden_size: 1024
  num_heads: 16
  scene_adaptor: residual_mlp2x_gelu
  scene_adaptor_hidden_size: 2048
  obs_encoder:
    emvis_config:
      model_adapter_config:
        dim_out: 1024

resume_from_checkpoint: null
output_dir: ${checkpoint_root}/beat_block_hammer/beat_b0_fm4_resmlp_d1024_20261101_v1
base_dir: ${output_dir}
hydra:
  run:
    dir: ${output_dir}/hydra
