# @package _global_
model:
  obs_encoder:
    rgb_key: ["left_cam", "right_cam", "head_cam"]
    emvis_config:
      processor_config:
        load_pretrain: false
        do_resize: false
        do_rescale: false
        do_normalize: true
        image_mean: [0.485, 0.456, 0.406]
        image_std: [0.229, 0.224, 0.225]
      efficientvit_fusion_mode: native
      dim_2d: null  # infer native trunk width; adapter still outputs 1024
      load_backbone_pretrain: true
      only_2d: true
      backbone_target: efficientvit
      backbone_path: ${oc.env:S1_ROOT,.}/pretrained/efficientvit_b2.r256_in1k
      backbone_config:
        model_name: efficientvit_b2.r256_in1k
      backbone_trainable: false
      # interpolate: 'bilinear'
      mlp_ratio: 1.0
      drop_p: 0.0
      only_first_view: False
      model_adapter_config:
        target: ResNetAdapter
        shape_out: [2, 2]
        dim_out: 1024
        conv_num: 2
      mv_fuser_config:
        depth: 1
        num_heads: 16   ## shared policy width
        mlp_ratio: 2.0
        drop_p: 0.0
        use_view_embed: true
        num_views: 3   # seed sensitivity
