# @package _global_
# Two independent trainable MBConv copies after the frozen B0 trunk.
defaults:
  - efficientvit_b0_native_3v
  - _self_

model:
  obs_encoder:
    emvis_config:
      backbone_config:
        stage4_repeats: 0
        mbconv_downsample_blocks: 2
        mbconv_downsample_init: stage4_local
      model_adapter_config:
        target: TokenProjection
        shape_out: [2, 3]
        dim_out: 1024
        conv_num: null
