# @package _global_
# Two extra calls of the original frozen stage4, with one shared trainable 1x1 bridge.
defaults:
  - efficientvit_b0_native_3v
  - _self_

model:
  obs_encoder:
    emvis_config:
      backbone_config:
        stage4_repeats: 2
      # Compression is now inside the backbone; no ResNet or adaptive pooling.
      model_adapter_config:
        target: TokenProjection
        shape_out: [2, 3]
        dim_out: 1024
        conv_num: null
